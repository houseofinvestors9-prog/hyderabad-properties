name: Sync government records

# Weekly until the site is public: Mondays 05:30 IST. Switch to daily at launch.
# Repository secrets: SITE_URL (e.g. https://hyderabad.properties) and CRON_SECRET.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET not set, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: TG-RERA project list (map feed)
        if: steps.check.outputs.skip != 'true'
        run: |
          curl --fail-with-body -sS -m 120 -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/rera-registry?step=feed"

      - name: TG-RERA project pages (repeat until done)
        if: steps.check.outputs.skip != 'true'
        run: |
          # Stop only on an explicit "remaining":0. Hostinger sometimes answers with a 307 page
          # instead of JSON; that is a retry, not the end.
          for i in $(seq 1 450); do
            out=$(curl -sS -m 120 -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/rera-registry?step=details&budgetMs=30000") || true
            remaining=$(echo "$out" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            if [ -z "$remaining" ]; then echo "retry: $(echo "$out" | head -c 120)"; sleep 20; continue; fi
            echo "$out"
            [ "$remaining" -eq 0 ] && break
          done

      - name: TG-RERA orders and public notices
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in $(seq 1 30); do
            out=$(curl -sS -m 120 -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/rera-registry?step=orders") || true
            remaining=$(echo "$out" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            if [ -z "$remaining" ]; then echo "retry: $(echo "$out" | head -c 120)"; sleep 20; continue; fi
            echo "$out"
            [ "$remaining" -eq 0 ] && break
          done

      - name: Watched sources (RERA, permits, lake buffer, guideline values)
        if: steps.check.outputs.skip != 'true'
        run: |
          curl --fail-with-body -sS -m 290 -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/sync-projects"
